name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

# 推送 gh-pages 分支需要写权限
permissions:
  contents: write

# 同一时间只允许一个部署任务，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7：运行于 Node 24（Node 20 runtime 已被 GitHub 弃用）
        uses: actions/checkout@v7

      - name: Install pnpm
        # v6+ 才支持 pnpm v12，v4 不支持；此处 version 不锁定
        uses: pnpm/action-setup@v6
        with:
          # 不锁定 pnpm 版本；如需完全可复现的构建，把 latest 改成具体版本号
          version: latest

      - name: Setup Node
        # v7：运行于 Node 24；node-version 指构建用的 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # base 路径自动跟随仓库名（项目页以 /<repo>/ 子路径访问）；
          # 仓库改名后无需改任何配置
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Deploy to gh-pages branch
        # 固定到 v4.1.0（更新了 Node runtime 的版本）；浮动的 @v4 不保证包含该更新
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # gh-pages 分支只保留最新一次提交，避免历史无限膨胀
          force_orphan: true
          commit_message: 'Deploy: ${{ github.event.head_commit.message }}'
